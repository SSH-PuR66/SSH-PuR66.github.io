name: Verify research package
on:
  push:
    branches: [main, 'research/**']
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Reproduce from exact upstream file identities
        run: python cartelkit/model_audit.py --fetch --check
      - name: Check equations, artifact boundaries and browser arithmetic
        run: |
          python -m unittest discover -s cartelkit -p 'test_*.py' -v
          node --test cartelkit/audit-math.test.cjs
      - name: Rebuild the immutable package
        run: |
          python cartelkit/cartelkit.py package
          git diff --exit-code -- cartelkit/index.html cartelkit/ASSESSMENT.md cartelkit/summary.json cartelkit/MANIFEST.sha256 cartelkit/cartelkit_deliverable.zip
